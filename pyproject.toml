[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-provider-darkmoon"
authors = [{ name = "ASC-IT (Darkmoon)" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Apache Airflow provider for Darkmoon: trigger autonomous AI pentest campaigns and consume their findings from a DAG (Darkmoon Pro Dashboard API)."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["airflow", "apache-airflow", "provider", "darkmoon", "pentest", "security", "appsec", "dast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
    "apache-airflow>=2.7",
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ASCIT31/Dark-Moon"
Source = "https://github.com/ASCIT31/airflow-provider-darkmoon"
Issues = "https://github.com/ASCIT31/airflow-provider-darkmoon/issues"

[project.entry-points.apache_airflow_provider]
provider_info = "darkmoon_provider.__init__:get_provider_info"

[tool.setuptools.dynamic]
version = { attr = "darkmoon_provider.__version__" }

[tool.setuptools.packages.find]
include = ["darkmoon_provider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
